name: Release macOS (dmg)

# 打 v* tag 推送到 main 即触发：云端 macOS 双架构（Apple Silicon + Intel）跑构建
# -> 各产出一份 .dmg -> 合到一个 GitHub Release（draft）。
# 例：git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ===== 1) 双架构并行构建：每个 runner 出自己架构的原生 dmg =====
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false          # 一个架构失败不影响另一个
      matrix:
        include:
          - os: macos-latest     # Apple Silicon (arm64)
            arch: aarch64
            label: apple-silicon
          - os: macos-15-intel   # Intel x64。注意：macos-13 已于 2025-12-04 被 GitHub
            arch: x64            # 完全退役（actions/runner-images#13046），pin 它会导致
            label: intel         # job 起不来；macos-15-intel 是官方最后一个 x86_64 镜像。
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create venv & install backend deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller waitress

      # 导入 Apple 证书到临时 keychain（CI 专用）。这一步必须在「冻结后端」之前，
      # 因为 PyInstaller 要在冻结阶段用证书递归签名 sidecar；也必须保持到 tauri-action
      # 步骤（Tauri 自动 codesign 时仍需从 keychain 取证书）。
      # 未配置 APPLE_SIGNING_IDENTITY 时整段跳过（仅出未签名 app）。
      - name: Setup macOS keychain (import Apple cert)
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$IDENTITY" ]; then
            echo "[ci] 未配置 APPLE_SIGNING_IDENTITY，跳过 keychain 配置（仅出未签名 app）"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KPW=$(openssl rand -base64 12)
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"   # 6h 内不自动锁，覆盖整个 job
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          echo "$CERT" | base64 -D > /tmp/cert.p12
          security import /tmp/cert.p12 -P "$CERT_PW" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN"
          rm -f /tmp/cert.p12
          echo "[ci] keychain 就绪：$KEYCHAIN"

      # 说明：sidecar 冻结（PyInstaller）已改由 tauri.conf.json 的 beforeBuildCommand 自动触发，
      # 本地 `npm run tauri build` 与 CI 的 tauri-action 都会在打包前先执行 freeze（避免本地
      # build 复用旧 sidecar）。证书 keychain 已在上一步导入，beforeBuildCommand 冻结时会
      # 继承 tauri-action 步骤的 env（含 APPLE_SIGNING_IDENTITY），PyInstaller 可直接递归签名。
      # 因此这里不再单独跑 Freeze backend 步骤，避免 freeze 两次。
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: desktop
        run: npm install

      # 生成前端静态目录 desktop/dist（占位）。
      # 说明：本应用 WebView 实际由 Django sidecar 在 http://127.0.0.1:14567 提供服务，
      # tauri.conf.json 的 frontendDist 只是 Tauri 构建期必须的占位目录（打进 .app 但运行时不被加载）。
      - name: Generate frontend dist placeholder
        working-directory: desktop
        run: |
          mkdir -p dist
          printf '<!doctype html>\n<html lang="zh-CN">\n<head><meta charset="utf-8"><title>PicHome</title></head>\n<body><p>Loading PicHome...</p></body>\n</html>\n' > dist/index.html
          echo "[ci] generated desktop/dist/index.html"

      # 只构建、不发布（不传 tagName，避免和 release 任务抢着建 Release）。
      # includeUpdaterJson=false 进一步避免任何 Release 相关 API 调用。
      # 只打 .app：Tauri 的 .app 打包不依赖 GUI，headless CI 可正常完成。
      # 注意：不要把 dmg 交给 Tauri 内置的 create-dmg —— 它最后会用 osascript
      # 调 Finder 做窗口美化，在无图形会话的 CI runner 上会卡死/报错，导致整个
      # `tauri build` 以退出码 1 失败。dmg 改由下面「Package dmg via hdiutil」手动生成。
      #
      # 公证策略（重要）：这里只做「签名」，不传 APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID，
      # 让 Tauri 自动跳过内置公证（日志会打印 "skipping app notarization..."）。
      # 原因：Tauri 的内置公证跑在 `tauri build` 的最末一步，报错时已来不及补签嵌套的
      # Python.framework。我们改为在 build 之后由 desktop/sign_app_bundle.sh + notarize.sh
      # 自己接管「深度签名 → 公证 → 装订」，才能把失败点提前、并拿到可定位的报错。
      - name: Build (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ===== Apple 开发者签名（去除 Gatekeeper 拦截）=====
          # 在仓库 Settings → Secrets and variables → Actions 中配置以下 6 个 Secrets 后即可生效。
          # 未配置时这些变量为空，tauri-action 自动跳过签名（仅生成未签名的 .app）。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: desktop
          args: '--bundles app'
          includeUpdaterJson: false

      # ① 先还原 .framework 目录结构（补 Info.plist + 重建 Versions/Current、Resources、
      #    <name> 三个符号链接；被 Tauri 拷成硬拷贝的还原为符号链接）—— 这是根治点：
      #    PyInstaller 只搬了框架里的二进制，框架残缺会导致 codesign 签出
      #    `Identifier=<目录名>` + `Info.plist=not bound`，公证必报
      #    "The signature of the binary is invalid."（path: .../Python.framework/Python）。
      # ② 再按「由内到外」深度重签，最后做全量 codesign --verify --strict 与
      #    framework 形态硬校验（必须出现非 0 的 Info.plist entries）——
      #    把问题从「公证阶段」提前到「构建阶段」，不再白跑一次公证。
      - name: Deep-sign app bundle (repair frameworks + nested signing)
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash sign_app_bundle.sh "src-tauri/target/release/bundle/macos/PicHome.app"

      # 自己公证 + 装订 .app（Tauri 内置公证已在上面被显式跳过）。
      # 失败时脚本会自动跑 `notarytool log <id>`，把每个出问题的文件路径与原因打出来。
      - name: Notarize & staple app
        working-directory: desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash notarize.sh "src-tauri/target/release/bundle/macos/PicHome.app"

      # 手动用 hdiutil 生成 dmg（完全 headless，不依赖 Finder / AppleScript）。
      # 先挂载临时可读写镜像并加入「应用程序」快捷方式，再压缩为最终 dmg。
      # 注意：不要写死 -size —— CI 的 sidecar 内嵌完整的 Python.framework（含 stdlib），
      # 体积远大于本地构建，写死尺寸会导致 "no space left"；交给 hdiutil 自动计算。
      - name: Package dmg via hdiutil
        working-directory: desktop/src-tauri/target/release/bundle
        run: |
          set -euo pipefail
          APP="macos/PicHome.app"
          VER="${{ github.ref_name }}"   # 例如 v1.0.0
          VER="${VER#v}"                  # 去掉前缀 v -> 1.0.0
          ARCH="${{ matrix.arch }}"       # aarch64 / x64
          DMG="dmg/PicHome_${VER}_${ARCH}.dmg"
          RW="$RUNNER_TEMP/rw.${ARCH}.dmg"

          mkdir -p dmg
          rm -f "$DMG" "$RW"
          echo "[dmg] 源 bundle 体积：$(du -sh "$APP" | cut -f1)"

          hdiutil create -volname "PicHome" -srcfolder "$APP" -format UDRW "$RW"

          # ⚠️ 不要写成 `hdiutil attach ... | grep ... | sed 1q | ...`：
          #    在 `set -o pipefail` 下，`sed 1q`（或 head -1）读一行就退出，会让
          #    上游命令收到 SIGPIPE（141），整条管道被判为失败。改为先落盘再解析。
          ATTACH_LOG="$RUNNER_TEMP/dmg-attach.log"
          if ! hdiutil attach -readwrite -noverify -noautoopen -nobrowse "$RW" > "$ATTACH_LOG" 2>&1; then
            cat "$ATTACH_LOG"; echo "::error::dmg 临时镜像挂载失败"; exit 1
          fi
          cat "$ATTACH_LOG"
          DEV="$(awk '/^\/dev\//{print $1; exit}' "$ATTACH_LOG")"
          if [ -z "$DEV" ] || [ ! -d "/Volumes/PicHome" ]; then
            echo "::error::未能解析挂载设备或卷未就绪（DEV='${DEV}'）"; exit 1
          fi
          ln -s /Applications "/Volumes/PicHome/Applications"
          hdiutil detach "$DEV"
          hdiutil convert "$RW" -format UDZO -o "$DMG"
          rm -f "$RW"
          ls -lh "$DMG"

      # dmg 也要签名 + 公证 + 装订。否则用户从浏览器下载 dmg（带 quarantine 属性）后，
      # Gatekeeper 会因「无法验证开发者」拦住打开 —— 即使里面的 .app 已经装订过。
      # notarize.sh 会先对 dmg 签名（stapler 要求目标已签名），再提交公证。
      - name: Notarize & staple dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          VER="${{ github.ref_name }}"; VER="${VER#v}"
          DMG="desktop/src-tauri/target/release/bundle/dmg/PicHome_${VER}_${{ matrix.arch }}.dmg"
          bash desktop/notarize.sh "$DMG"

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.label }}
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ===== 2) 等两个架构都构建完，合到一个 Release（draft）=====
  release:
    name: Create Release (both archs)
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download all dmgs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --draft \
            --title "PicHome ${{ github.ref_name }}" \
            --notes "macOS 桌面端安装包（Apple Silicon / Intel 双架构）。

          未签名版本首次打开可能提示「无法验证开发者」，右键 -> 打开 即可。" \
            artifacts/*/*.dmg
