name: Release macOS (dmg)

# 打 v* tag 推送到 main 即触发：云端 macOS 双架构（Apple Silicon + Intel）跑构建
# -> 各产出一份 .dmg -> 合到一个 GitHub Release（draft）。
# 例：git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ===== 1) 双架构并行构建：每个 runner 出自己架构的原生 dmg =====
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false          # 一个架构失败不影响另一个
      matrix:
        include:
          - os: macos-latest     # Apple Silicon (arm64)
            arch: aarch64
            label: apple-silicon
          - os: macos-13         # Intel x64（GitHub 唯一仍提供 Intel 的 runner）
            arch: x64
            label: intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create venv & install backend deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller waitress

      # 冻结后端：生成 desktop/src-tauri/bin/pichome-server（Tauri sidecar，按当前架构原生编译）
      - name: Freeze backend -> src-tauri/bin/pichome-server
        run: bash desktop/build_backend.sh

      # 关键修复：配置了 Apple 证书时 tauri-action 会自动「签名 + 公证」。
      # 但 Tauri 自带的 codesign 只签 .app 主二进制，不会递归签名
      # Resources/pichome-server 这个 PyInstaller 第三方 bundle（其内部 .so/.dylib/
      # Python 解释器都未签名）。Apple 公证会扫描到这些未签名二进制并直接拒绝
      # （"The binary is not signed with a valid Developer ID certificate"），导致
      # tauri build 退出码 1。
      # 因此在 tauri build 之前，先把整个 sidecar 目录用 Developer ID 证书 + 安全时间戳
      # 递归签名（主可执行额外附加 PyInstaller 需要的 entitlements），公证即可通过。
      # 未配置证书（APPLE_SIGNING_IDENTITY 为空）时整段跳过，仅产出未签名 app。
      - name: Codesign PyInstaller sidecar (for notarization)
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        working-directory: desktop/src-tauri/bin
        run: |
          set -euo pipefail
          # 仅当配置了 Apple 签名身份时才签名；否则跳过（仅出未签名 app）。
          # 注意：GitHub 不允许在 step 级 if 里引用 secrets（if 求值早于 secret 注入），
          # 因此证书是否配置的判断放在脚本内部。
          if [ -z "$IDENTITY" ]; then
            echo "[ci] 未配置 APPLE_SIGNING_IDENTITY，跳过 sidecar 签名（仅出未签名 app）"
            exit 0
          fi
          # 1) 导入证书到临时 keychain（CI 专用，不污染本机 login keychain）
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KPW=$(openssl rand -base64 12)
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          echo "$CERT" | base64 -D > /tmp/cert.p12
          security import /tmp/cert.p12 -P "$CERT_PW" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN"
          # 2) 递归签名 sidecar 内所有 Mach-O（.so/.dylib/Python 解释器等）
          SIDECAR="pichome-server"
          ENT="${{ github.workspace }}/desktop/entitlements.plist"
          echo "[ci] 递归签名 sidecar: $SIDECAR (identity=$IDENTITY)"

          # 2.0) PyInstaller 硬链接处理（关键坑）：
          #      _internal/Python 与 _internal/Python.framework/Python 通常是同一 inode 的
          #      硬链接。若分别 codesign 会互相覆盖，导致其中一个签名损坏 -> Apple 公证报
          #      "The signature of the binary is invalid"。先打破硬链接让二者成为独立文件。
          PY_A="$SIDECAR/_internal/Python"
          PY_B="$SIDECAR/_internal/Python.framework/Python"
          if [ -f "$PY_A" ] && [ -f "$PY_B" ]; then
            IA=$(stat -f %i "$PY_A" 2>/dev/null || true)
            IB=$(stat -f %i "$PY_B" 2>/dev/null || true)
            if [ -n "$IA" ] && [ "$IA" = "$IB" ]; then
              echo "[ci] 打破 Python 硬链接 (inode=$IA)"
              cp -f "$PY_A" "$PY_B.tmp" && mv -f "$PY_B.tmp" "$PY_B"
            fi
          fi

          # 2.1) 单独用 --deep 签名 Python.framework（正确处理其内部二进制与 Versions 结构）
          if [ -d "$SIDECAR/_internal/Python.framework" ]; then
            codesign --force --deep --timestamp --options runtime \
              -s "$IDENTITY" "$SIDECAR/_internal/Python.framework"
          fi

          # 2.2) 递归签名其余 Mach-O（排除已用 --deep 处理的 Python.framework 内部）
          find "$SIDECAR" -type f ! -path "$SIDECAR/_internal/Python.framework/*" -print0 | \
          while IFS= read -r -d '' f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --timestamp --options runtime -s "$IDENTITY" "$f" || exit 1
            fi
          done

          # 3) 主可执行带 entitlements 最后签（确保晚于其依赖）
          codesign --force --timestamp --options runtime \
            --entitlements "$ENT" -s "$IDENTITY" "$SIDECAR/pichome-server"
          # 4) 校验
          codesign --verify --deep --strict "$SIDECAR/pichome-server" \
            && echo "[ci] sidecar codesign OK"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: desktop
        run: npm install

      # 生成前端静态目录 desktop/dist（占位）。
      # 说明：本应用 WebView 实际由 Django sidecar 在 http://127.0.0.1:14567 提供服务，
      # tauri.conf.json 的 frontendDist 只是 Tauri 构建期必须的占位目录（打进 .app 但运行时不被加载）。
      - name: Generate frontend dist placeholder
        working-directory: desktop
        run: |
          mkdir -p dist
          printf '<!doctype html>\n<html lang="zh-CN">\n<head><meta charset="utf-8"><title>PicHome</title></head>\n<body><p>Loading PicHome...</p></body>\n</html>\n' > dist/index.html
          echo "[ci] generated desktop/dist/index.html"

      # 只构建、不发布（不传 tagName，避免和 release 任务抢着建 Release）。
      # includeUpdaterJson=false 进一步避免任何 Release 相关 API 调用。
      # 只打 .app：Tauri 的 .app 打包不依赖 GUI，headless CI 可正常完成。
      # 注意：不要把 dmg 交给 Tauri 内置的 create-dmg —— 它最后会用 osascript
      # 调 Finder 做窗口美化，在无图形会话的 CI runner 上会卡死/报错，导致整个
      # `tauri build` 以退出码 1 失败。dmg 改由下面「Package dmg via hdiutil」手动生成。
      - name: Build (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ===== Apple 开发者签名（去除 Gatekeeper 拦截）=====
          # 在仓库 Settings → Secrets and variables → Actions 中配置以下 6 个 Secrets 后即可生效。
          # 未配置时这些变量为空，tauri-action 自动跳过签名（仅生成未签名的 .app）。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          args: '--bundles app'
          includeUpdaterJson: false

      # 手动用 hdiutil 生成 dmg（完全 headless，不依赖 Finder / AppleScript）。
      # 先挂载临时可读写镜像并加入「应用程序」快捷方式，再压缩为最终 dmg。
      - name: Package dmg via hdiutil
        working-directory: desktop/src-tauri/target/release/bundle
        run: |
          APP="macos/PicHome.app"
          VER="${{ github.ref_name }}"   # 例如 v0.1.0
          VER="${VER#v}"                  # 去掉前缀 v -> 0.1.0
          ARCH="${{ matrix.arch }}"       # aarch64 / x64
          DMG="dmg/PicHome_${VER}_${ARCH}.dmg"
          mkdir -p dmg
          RW="dmg/rw.${ARCH}.dmg"
          hdiutil create -volname "PicHome" -srcfolder "$APP" -format UDRW -size 400m "$RW"
          DEV=$(hdiutil attach -readwrite -noverify -noautoopen -nobrowse "$RW" | grep '^/dev/' | sed 1q | awk '{print $1}')
          ln -s /Applications "/Volumes/PicHome/Applications"
          hdiutil detach "$DEV"
          hdiutil convert "$RW" -format UDZO -o "$DMG"
          rm -f "$RW"
          ls -lh "$DMG"

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.label }}
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ===== 2) 等两个架构都构建完，合到一个 Release（draft）=====
  release:
    name: Create Release (both archs)
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download all dmgs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --draft \
            --title "PicHome ${{ github.ref_name }}" \
            --notes "macOS 桌面端安装包（Apple Silicon / Intel 双架构）。

          未签名版本首次打开可能提示「无法验证开发者」，右键 -> 打开 即可。" \
            artifacts/*/*.dmg
