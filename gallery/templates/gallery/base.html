<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}七牛云图库{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'gallery/css/style.css' %}">
  <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◧</span>
      <span class="brand-name">七牛云图库</span>
    </div>

    <nav class="nav">
      <a href="{% url 'gallery:index' %}" class="{% if request.path == '/' %}active{% endif %}">图库</a>
      <a href="{% url 'gallery:recycle' %}" class="{% if '/recycle' in request.path %}active{% endif %}">
        回收站{% if deleted_count %}<span class="badge">{{ deleted_count }}</span>{% endif %}
      </a>
    </nav>

    <div class="user-area">
      <span class="user-name" title="{{ user.username }}">{{ user.username }}</span>
      <form method="post" action="{% url 'gallery:logout' %}">
        {% csrf_token %}
        <button class="btn btn-sm btn-ghost" type="submit">退出</button>
      </form>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- 通用弹窗：确认 / 输入（替代浏览器原生 confirm / prompt） -->
  <div class="modal" id="modal" hidden>
    <div class="modal-mask" id="modalMask"></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 class="modal-title" id="modalTitle">提示</h3>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-input" id="modalInputWrap" hidden>
        <input id="modalInput" class="modal-field" type="text" autocomplete="off">
        <p class="muted modal-hint">多个标签用逗号或空格分隔</p>
      </div>
      <div class="modal-actions">
        <button class="btn" id="modalCancel" type="button">取消</button>
        <button class="btn btn-primary" id="modalOk" type="button">确定</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  {% block scripts %}{% endblock %}
</body>
</html>
