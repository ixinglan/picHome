[package]
name = "pichome-desktop"
version = "0.1.0"
description = "PicHome 桌面端"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon 提供 macOS 菜单栏（顶部状态栏）托盘图标，对应模式 A 的辅助入口
# image-png 用于从 PNG 字节加载菜单栏图标（include_bytes! + Image::from_bytes）
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
