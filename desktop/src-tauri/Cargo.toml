[package]
name = "pichome-desktop"
version = "1.0.0"
description = "PicHome 桌面端"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon 提供 macOS 菜单栏（顶部状态栏）托盘图标，对应模式 A 的辅助入口。
# image-png 用于从 PNG 字节加载菜单栏图标（include_bytes! + Image::from_bytes）。
# 菜单栏图标使用 icon_as_template(true)，macOS 会按当前主题自动着色，不再是一坨蓝色方块。
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# libc 用于 kill_backend 里 killpg 杀掉整个进程组（PyInstaller bootloader 会 fork
# 出 Python 子进程监听 14567，只杀父进程会留孤儿进程、端口残留）。
libc = "0.2"
